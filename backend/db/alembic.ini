# Alembic configuration for the development command line only - the application
# configures Alembic in code (db/migrate.py) and does not read this file.
#
#   alembic -c backend/db/alembic.ini revision --autogenerate -m "describe the change"
#   alembic -c backend/db/alembic.ini upgrade head
#
# The database is DATA_DIR/myastroboard.db (DATA_DIR defaults to ./data).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/..
