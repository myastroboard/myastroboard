<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <meta name="msapplication-TileColor" content="#0b1220">
    <meta name="msapplication-TileImage" content="/static/ico/windows/Square150x150Logo.scale-100.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MyAstroBoard">
    <meta name="app-version" content="{{ version }}">
    <meta name="description" content="Login to MyAstroBoard, the open-source self-hosted astronomy dashboard for observation and astrophotography planning. Learn more at myastroboard.org.">
    {% if seo_indexable %}
    <meta name="robots" content="index, follow">
    <meta name="generator" content="MyAstroBoard {{ version }}">
    <link rel="canonical" href="{{ request.url_root }}login">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MyAstroBoard">
    <meta property="og:title" content="MyAstroBoard - Astronomy Observation Planning Dashboard">
    <meta property="og:description" content="Self-hosted astronomy dashboard combining weather and astronomical conditions, automated SkyTonight execution, and planning tools for observation and astrophotography sessions.">
    <meta property="og:url" content="{{ request.url_root }}login">
    <meta property="og:image" content="{{ request.url_root }}static/img/pwa-screenshot-wide.png">
    <meta property="og:image:width" content="1556">
    <meta property="og:image:height" content="760">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MyAstroBoard - Astronomy Observation Planning Dashboard">
    <meta name="twitter:description" content="Self-hosted astronomy dashboard combining weather and astronomical conditions, automated SkyTonight execution, and planning tools for observation and astrophotography sessions.">
    <meta name="twitter:image" content="{{ request.url_root }}static/img/pwa-screenshot-wide.png">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MyAstroBoard",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Docker, Linux, Windows, macOS",
        "url": "https://myastroboard.org",
        "description": "Self-hosted astronomy dashboard combining weather and astronomical conditions, automated SkyTonight execution, and planning tools for observation and astrophotography sessions.",
        "isAccessibleForFree": true,
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "sameAs": ["https://github.com/myastroboard/myastroboard"]
    }
    </script>
    {% else %}
    <meta name="robots" content="noindex, nofollow">
    {% endif %}
    <script src="/static/js/theme.js?v={{ version }}"></script>
    <title data-i18n="auth.login_page_title">Login - MyAstroBoard</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/ico/ios/32.png?v={{ version }}">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/ico/ios/16.png?v={{ version }}">
    <link rel="manifest" href="/manifest.webmanifest?v={{ version }}">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/ico/ios/180.png?v={{ version }}">
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css?v={{ version }}" rel="stylesheet">
    <link href="/static/vendor/bootstrap-icons/font/bootstrap-icons.min.css?v={{ version }}" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="/static/vendor/bootstrap-icons/font/bootstrap-icons.min.css?v={{ version }}" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="/static/css/bs_icons_custom.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/bs_variables.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/bs_main.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/bs_login.css?v={{ version }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <h1><img src="/static/img/favicon-animated.svg" alt="MyAstroBoard Logo" width="48" height="48" class="login-logo-icon"> MyAstroBoard</h1>
            <p data-i18n="auth.please_authenticate">Please log in to continue</p>
        </div>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <form id="login-form" class="login-form" method="post" action="/api/auth/login">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" data-i18n-placeholder="users.username" required autofocus autocomplete="username">
                <label for="username" data-i18n="users.username" id="username-label"><i class="bi bi-person-circle icon-inline" aria-hidden="true"></i>Username</label>
            </div>
            
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" data-i18n-placeholder="users.password" required autocomplete="current-password">
                <label for="password" data-i18n="users.password" id="password-label"><i class="bi bi-shield-lock icon-inline" aria-hidden="true"></i>Password</label>
            </div>
            
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                <label class="form-check-label" for="remember-me" data-i18n="auth.remember_me_30_days">Remember me (stay logged in for 30 days)</label>
            </div>
            
            <button type="submit" class="btn btn-login" id="login-btn">
                <span class="btn-text" data-i18n="auth.sign_in"><i class="bi bi-rocket-takeoff icon-inline" aria-hidden="true"></i>Sign In</span>
            </button>
        </form>

        <!-- Second login step, shown only when the account has two-factor authentication active -->
        <div id="otp-step" class="login-form" hidden>
            <p class="otp-prompt" data-i18n="auth.otp_prompt">Enter the 6-digit code from your authenticator app.</p>

            <div class="form-floating mb-3">
                <input type="text" class="form-control text-center otp-code-input" id="otp-code" name="otp-code" placeholder="000000" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">
                <label for="otp-code" data-i18n="auth.otp_code">Verification code</label>
            </div>

            <button type="button" class="btn btn-login" id="otp-verify-btn">
                <span class="btn-text" data-i18n="auth.otp_verify"><i class="bi bi-shield-check icon-inline" aria-hidden="true"></i>Verify</span>
            </button>

            <div class="mt-3 text-center">
                <button type="button" class="btn btn-outline-light btn-sm" id="otp-back-btn" data-i18n="auth.otp_back">Back to sign in</button>
            </div>
        </div>

        <div class="mt-3 text-center">
            <button type="button" class="btn btn-outline-light btn-sm pwa-install-btn" data-pwa-install hidden>
                <span data-i18n="pwa.install_app"></span>
            </button>
        </div>

        <div class="mt-3 text-center">
            <a class="footer-link footer-link-subtle login-powered-by" href="https://myastroboard.org" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-globe2 icon-inline" aria-hidden="true"></i>
                <span data-i18n="auth.powered_by_myastroboard">Powered by MyAstroBoard</span>
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js?v={{ version }}"></script>
    <script src="/static/js/i18n.js?v={{ version }}"></script>
    <script src="/static/js/pwa.js?v={{ version }}"></script>
    <script src="/static/js/login.js?v={{ version }}"></script>
</body>
</html>
