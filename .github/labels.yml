# Every label of the repository, applied by .github/workflows/labels.yml.
# Edit labels here, not in the GitHub UI: the next sync overwrites colors and
# descriptions. Rename a label with `from_name` so issues keep it.
#
# One color per family, so the kind of a label reads at a glance:
#   type          strong, distinct hues   bug, enhancement, documentation, question
#   breaking      black                   Breaking change
#   status        yellow / orange         needs-info, stale, no-triage
#   resolution    grey                    duplicate, invalid, wontfix
#   community     green                   good first issue, help wanted
#   component     light blue              component: *
#   dependencies  lavender                dependencies + one per ecosystem (Dependabot)
#
# The component list mirrors the "Component" dropdown of both issue templates,
# mapped in .github/workflows/issue-automation.yml.

# Type
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: 1d76db
  description: New feature or request
- name: documentation
  color: 5319e7
  description: Improvements or additions to documentation
- name: question
  color: cc317c
  description: Further information is requested

# Breaking
- name: Breaking change
  color: "000000"
  description: Breaking change in this PR/Commit

# Status
- name: needs-info
  color: fbca04
  description: Additional information is needed from the reporter
- name: stale
  color: e99d42
  description: No answer to a needs-info request, closed soon
- name: no-triage
  color: fef2c0
  description: Skip the automated Claude triage

# Resolution
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: invalid
  color: cfd3d7
  description: This doesn't seem right
- name: wontfix
  color: cfd3d7
  description: This will not be worked on

# Community
- name: good first issue
  color: 0e8a16
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed

