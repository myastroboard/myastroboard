name: Post-Release Cleanup

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to archive (e.g. 0.8.1) - leave empty to use latest tag'
        required: false

jobs:
  archive-changelog:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          TAG=""

          if [ "$EVENT_NAME" = "release" ] && printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAG="$RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_run" ] && printf '%s' "$WORKFLOW_HEAD_BRANCH" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAG="$WORKFLOW_HEAD_BRANCH"
          elif printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            TAG="v$INPUT_VERSION"
          else
            TAG=$(git tag --sort=-version:refname | head -1)
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG=$(git tag --sort=-version:refname | head -1)
          fi

          if [ -z "$TAG" ]; then
            echo "No valid release tag found."
            exit 1
          fi

          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_PUBLISHED_AT" ]; then
            echo "DATE=${RELEASE_PUBLISHED_AT%%T*}" >> $GITHUB_OUTPUT
          else
            echo "DATE=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          fi

      - name: Create branch and PR to archive the CHANGELOG Unreleased section
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_DATE: ${{ steps.version.outputs.DATE }}
        run: |
          VERSION="${VERSION:-}"

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid VERSION output: $VERSION"
            exit 1
          fi

          if ! printf '%s' "$RELEASE_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid RELEASE_DATE output: $RELEASE_DATE"
            exit 1
          fi

          BRANCH="bot/post-release-v${VERSION}"

          if ! printf '%s' "$BRANCH" | grep -Eq '^bot/post-release-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid branch name: $BRANCH"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          VERSION="$VERSION" RELEASE_DATE="$RELEASE_DATE" python3 - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          date = os.environ["RELEASE_DATE"]

          path = "CHANGELOG.md"
          text = open(path, encoding="utf-8").read()

          match = re.search(r"^## \[Unreleased\]\s*\n(.*?)(?=\n## |\Z)", text, re.S | re.M)
          if not match:
              sys.exit("Could not find '## [Unreleased]' section in CHANGELOG.md")

          released_body = match.group(1).strip(chr(10))
          template_body = (
              "### Features\n\n- None.\n\n"
              "### Fixes\n\n- None.\n\n"
              "### Breaking changes\n\n- None."
          )

          new_section = (
              f"## [Unreleased]\n\n{template_body}\n\n"
              f"## {version} ({date})\n\n{released_body}\n"
          )

          start, end = match.span(0)
          new_text = text[:start] + new_section + text[end:]
          open(path, "w", encoding="utf-8").write(new_text)
          PY

          git add CHANGELOG.md

          if git diff --staged --quiet; then
            echo "CHANGELOG.md is unchanged, nothing to do."
            exit 0
          fi

          git commit -m "chore: archive CHANGELOG Unreleased section for release v${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: archive CHANGELOG Unreleased section for release v${VERSION}" \
            --body "Automated archival after tagging release v${VERSION}: moves the Unreleased section to a dated ${VERSION} entry and resets Unreleased to the template." \
            --base main \
            --head "$BRANCH"
