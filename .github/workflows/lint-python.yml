name: Lint Python

on:
  push:
    paths:
      - "backend/**/*.py"
      - "backend/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "tests/*.py"
      - "pyrightconfig.json"
      - "pyproject.toml"
      - ".github/org/ruff.base.toml"
      - ".github/org/pyright.base.json"
      - ".github/workflows/lint-python.yml"
  pull_request:
    paths:
      - "backend/**/*.py"
      - "backend/*.py"
      - "scripts/**/*.py"
      - "tests/**/*.py"
      - "tests/*.py"
      - "pyrightconfig.json"
      - "pyproject.toml"
      - ".github/org/ruff.base.toml"
      - ".github/org/pyright.base.json"
      - ".github/workflows/lint-python.yml"

jobs:
  lint-python:
    name: ruff (whole repo) / pyright (backend + scripts)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # ruff takes about a second on the whole repository, so it checks everything: a
      # configuration change (pyproject.toml, the synced organization baseline) is caught too.
      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      # pyright checks the whole scope set in pyrightconfig.json (backend/ and scripts/; tests/
      # stays out, see CONTRIBUTING.md) in about 15 seconds, so - like ruff - it never narrows to
      # the changed files: a change to the configuration or the synced organization baseline is
      # caught too. --level error keeps the log to the errors that fail the job; the warnings are
      # the annotation debt relaxed in pyrightconfig.json.
      - name: pyright
        run: pyright --level error
